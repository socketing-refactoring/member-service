repos:
  - repo: local
    hooks:
      - id: spotless-apply
        name: Apply spotless formatting plugin
        entry: bash -c ./gradlew formattingApply
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: checkstyle-apply
        name: Check Java style
        entry: bash -c './gradlew checkstyleMain checkstyleTest'
        language: system
        pass_filenames: false
