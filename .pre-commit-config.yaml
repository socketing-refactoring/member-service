repos:
  - repo: "local"
    hooks:
      - id: "formatting-test"
        name: "Execute Gradle Check, Test"
        entry: "bash -c './gradlew check'"
        language: "system"
        pass_filenames: false
  - repo: "local"
    hooks:
      - id: "create-docs"
        name: "Execute Gradle Asciidoc"
        language: "system"
        entry: "bash -c './gradlew asciidoctor'"
        pass_filenames: false
  - repo: "local"
    hooks:
      - id: "publish-docs"
        name: "Execute Gradle GitPublish"
        language: "system"
        entry: "bash -c './gradlew gitPublishPush'"
        pass_filenames: false
